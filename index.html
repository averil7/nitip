<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitip Makan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #ff6b35;
    --accent2: #ffb347;
    --green: #4ade80;
    --red: #f87171;
    --text: #f0f0f0;
    --muted: #6b6b6b;
    --paid: #1a2e1a;
    --paid-border: #2d5a2d;
    --font: Tahoma, Geneva, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding-bottom: 80px; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-family: var(--font); font-size: 20px; font-weight: 800; }
  .logo span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .session-badge { font-size: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; color: var(--muted); }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
  .sync-dot.syncing { background: var(--accent2); animation: pulse 1s infinite; }
  .sync-dot.synced { background: var(--green); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .summary-bar {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    padding: 14px 20px;
    display: flex; gap: 20px; align-items: center; justify-content: space-between;
  }
  .stat { text-align: center; }
  .stat-val { font-family: var(--font); font-size: clamp(14px,2vw,20px); font-weight: 800; color: #fff; line-height: 1; word-break: break-all; }
  .stat-label { font-size: 10px; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .divider-v { width: 1px; height: 32px; background: rgba(255,255,255,0.3); }

  .add-section { padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .add-section h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
  .form-row { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-bottom: 8px; }
  .form-row2 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
  input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--font); font-size: 14px; border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color 0.2s; width: 100%; }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  .btn-add { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-family: var(--font); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: opacity 0.2s, transform 0.1s; }
  .btn-add:active { transform: scale(0.97); opacity: 0.9; }
  .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }

  .filter-tabs { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; scrollbar-width: none; }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: var(--font); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .orders-container { padding: 0 20px; }
  .person-group { margin-bottom: 20px; }
  .person-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 10px 14px; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }
  .person-name-row { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; flex-shrink: 0; }
  .person-name { font-weight: 700; font-size: 15px; }
  .person-total { font-size: 13px; font-weight: 500; color: var(--accent2); }
  .pay-all-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: var(--font); transition: all 0.2s; }
  .pay-all-btn.paid-state { border-color: var(--green); color: var(--green); }

  .order-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; transition: all 0.25s; animation: slideIn 0.25s ease; }
  @keyframes slideIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  .order-item.paid-item { background: var(--paid); border-color: var(--paid-border); opacity: 0.75; }
  .check-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 11px; }
  .check-btn.checked { background: var(--green); border-color: var(--green); color: #fff; }
  .order-info { flex: 1; min-width: 0; }
  .order-menu { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .order-item.paid-item .order-menu { text-decoration: line-through; color: var(--muted); }
  .order-meta { display: flex; gap: 8px; margin-top: 2px; align-items: center; flex-wrap: wrap; }
  .order-price { font-size: 12px; color: var(--accent2); font-weight: 500; }
  .order-note { font-size: 11px; color: var(--muted); background: var(--surface2); padding: 2px 6px; border-radius: 4px; }
  .order-by { font-size: 10px; color: var(--muted); font-style: italic; }
  .del-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px; border-radius: 6px; flex-shrink: 0; transition: color 0.2s; }
  .del-btn:hover { color: var(--red); }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 8px; }
  .btn-reset { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 10px; padding: 12px; font-family: var(--font); font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .btn-reset:hover { border-color: var(--red); color: var(--red); }
  .btn-copy { flex: 2; background: var(--accent); border: none; color: #fff; border-radius: 10px; padding: 12px; font-family: var(--font); font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
  .btn-copy:active { transform: scale(0.98); }

  .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-10px); background: var(--green); color: #0f0f0f; font-family: var(--font); font-weight: 700; font-size: 13px; padding: 8px 18px; border-radius: 20px; opacity: 0; transition: all 0.3s; z-index: 999; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* NAME MODAL */
  .name-overlay { display: flex; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
  .name-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 360px; text-align: center; }
  .name-modal .icon { font-size: 40px; margin-bottom: 12px; }
  .name-modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .name-modal p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .name-modal input { margin-bottom: 12px; text-align: center; font-size: 16px; }
  .btn-enter { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-family: var(--font); font-weight: 700; font-size: 15px; cursor: pointer; }

  /* CONFIRM MODAL */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: flex-end; justify-content: center; }
  .overlay.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px 20px 0 0; padding: 24px 20px 32px; width: 100%; max-width: 480px; animation: slideUp 0.25s ease; }
  @keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
  .modal p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 12px; border-radius: 10px; font-family: var(--font); font-weight: 700; font-size: 14px; cursor: pointer; border: none; }
  .modal-cancel { background: var(--surface2); color: var(--text); border: 1px solid var(--border) !important; }
  .modal-confirm { background: var(--red); color: #fff; }

  /* Loading */
  .loading-bar { height: 2px; background: var(--accent); width: 0%; transition: width 0.3s; position: fixed; top: 0; left: 0; z-index: 999; }

  .c0{background:#e85d04} .c1{background:#3a86ff} .c2{background:#8338ec}
  .c3{background:#06d6a0} .c4{background:#fb5607} .c5{background:#ff006e}
  .c6{background:#0077b6} .c7{background:#7b2d8b}
</style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>

<!-- Name Entry Modal -->
<div class="name-overlay" id="nameOverlay">
  <div class="name-modal">
    <div class="icon">🍽️</div>
    <h3>Siapa kamu?</h3>
    <p>Masukkan namamu biar pesananmu tercatat dengan benar</p>
    <input type="text" id="myNameInput" placeholder="Nama kamu..." maxlength="30" />
    <button class="btn-enter" onclick="setMyName()">Masuk →</button>
  </div>
</div>

<header>
  <div class="logo">Nitip<span>.</span>Makan</div>
  <div class="header-right">
    <div class="sync-dot" id="syncDot" title="Status sync"></div>
    <div class="session-badge" id="sessionDate"></div>
  </div>
</header>

<div class="summary-bar">
  <div class="stat"><div class="stat-val" id="totalPeople">0</div><div class="stat-label">Orang</div></div>
  <div class="divider-v"></div>
  <div class="stat"><div class="stat-val" id="totalItems">0</div><div class="stat-label">Item</div></div>
  <div class="divider-v"></div>
  <div class="stat"><div class="stat-val" id="totalPaid">0</div><div class="stat-label">Sudah Bayar</div></div>
  <div class="divider-v"></div>
  <div class="stat"><div class="stat-val" id="totalAmount">Rp0</div><div class="stat-label">Total</div></div>
</div>

<div class="add-section">
  <h2>+ Tambah Pesanan</h2>
  <div class="form-row">
    <input type="text" id="inputName" placeholder="Nama pemesan" />
    <input type="text" id="inputMenu" placeholder="Menu (contoh: Geprek paha atas)" />
  </div>
  <div class="form-row2">
    <input type="number" id="inputPrice" placeholder="Harga (opsional)" min="0" />
    <input type="text" id="inputNote" placeholder="Catatan (TF/Cash/dll)" />
    <button class="btn-add" id="btnAdd" onclick="addOrder()">＋ Add</button>
  </div>
</div>

<div class="filter-tabs">
  <div class="tab active" onclick="setFilter('all', this)">Semua</div>
  <div class="tab" onclick="setFilter('unpaid', this)">Belum Bayar</div>
  <div class="tab" onclick="setFilter('paid', this)">Sudah Bayar</div>
</div>

<div class="orders-container" id="ordersList"></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="overlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Reset semua?</h3>
    <p>Semua pesanan akan dihapus untuk semua orang.</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Batal</button>
      <button class="modal-confirm" onclick="confirmReset()">Reset</button>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <button class="btn-reset" onclick="openModal()">🗑 Reset</button>
  <button class="btn-copy" onclick="copyToClipboard()">📋 Copy ke WA</button>
</div>

<script>
  const COLORS = ['c0','c1','c2','c3','c4','c5','c6','c7'];
  const STORAGE_KEY = 'nitipMakan-shared-v1';
  const POLL_INTERVAL = 4000; // poll every 4 seconds

  let orders = [];
  let filter = 'all';
  let colorMap = {};
  let colorIdx = 0;
  let myName = localStorage.getItem('nitipMyName') || '';
  let pollTimer = null;
  let lastHash = '';

  // ── Name modal ──
  function initNameModal() {
    if (myName) {
      document.getElementById('nameOverlay').style.display = 'none';
      document.getElementById('inputName').value = myName;
      startPolling();
    } else {
      document.getElementById('nameOverlay').style.display = 'flex';
      document.getElementById('myNameInput').focus();
    }
  }

  function setMyName() {
    const v = document.getElementById('myNameInput').value.trim();
    if (!v) { showToast('⚠️ Masukkan namamu dulu!'); return; }
    myName = v;
    localStorage.setItem('nitipMyName', myName);
    document.getElementById('nameOverlay').style.display = 'none';
    document.getElementById('inputName').value = myName;
    startPolling();
  }

  // ── Shared storage ──
  async function loadFromStorage() {
    try {
      setSyncDot('syncing');
      const res = await window.storage.get(STORAGE_KEY, true); // shared=true
      const data = res ? JSON.parse(res.value) : { orders: [], colorMap: {}, colorIdx: 0 };
      const newHash = JSON.stringify(data.orders);
      if (newHash !== lastHash) {
        lastHash = newHash;
        orders = data.orders || [];
        colorMap = data.colorMap || {};
        colorIdx = data.colorIdx || 0;
        render();
      }
      setSyncDot('synced');
    } catch(e) {
      // Key not found = first time
      orders = [];
      setSyncDot('synced');
      render();
    }
  }

  async function saveToStorage() {
    try {
      setSyncDot('syncing');
      const data = { orders, colorMap, colorIdx, updatedAt: Date.now() };
      await window.storage.set(STORAGE_KEY, JSON.stringify(data), true); // shared=true
      lastHash = JSON.stringify(orders);
      setSyncDot('synced');
    } catch(e) {
      setSyncDot('synced');
      showToast('⚠️ Gagal menyimpan, coba lagi');
    }
  }

  function startPolling() {
    loadFromStorage();
    pollTimer = setInterval(loadFromStorage, POLL_INTERVAL);
  }

  function setSyncDot(state) {
    const dot = document.getElementById('syncDot');
    dot.className = 'sync-dot ' + state;
  }

  // ── Helpers ──
  function getColor(name) {
    const k = name.toLowerCase();
    if (!colorMap[k]) { colorMap[k] = COLORS[colorIdx % COLORS.length]; colorIdx++; }
    return colorMap[k];
  }
  function getInitial(name) { return name.trim().charAt(0).toUpperCase(); }
  function formatRupiahFull(n) { return 'Rp' + n.toLocaleString('id-ID'); }

  // ── Actions ──
  async function addOrder() {
    const name = document.getElementById('inputName').value.trim();
    const menu = document.getElementById('inputMenu').value.trim();
    const price = parseInt(document.getElementById('inputPrice').value) || 0;
    const note = document.getElementById('inputNote').value.trim();
    if (!name || !menu) { showToast('⚠️ Nama & menu wajib diisi!'); return; }

    const btn = document.getElementById('btnAdd');
    btn.disabled = true;

    // Reload first to avoid overwrite conflict
    await loadFromStorage();
    getColor(name); // ensure color assigned
    orders.push({ id: Date.now(), name, menu, price, note, paid: false, addedBy: myName });
    await saveToStorage();
    render();

    document.getElementById('inputMenu').value = '';
    document.getElementById('inputPrice').value = '';
    document.getElementById('inputNote').value = '';
    document.getElementById('inputMenu').focus();
    showToast('✓ Pesanan ditambahkan');
    btn.disabled = false;
  }

  async function togglePaid(id) {
    await loadFromStorage();
    const o = orders.find(x => x.id === id);
    if (o) { o.paid = !o.paid; await saveToStorage(); render(); }
  }

  async function deleteOrder(id) {
    await loadFromStorage();
    orders = orders.filter(x => x.id !== id);
    await saveToStorage();
    render();
  }

  async function togglePayAll(person) {
    await loadFromStorage();
    const po = orders.filter(x => x.name.toLowerCase() === person.toLowerCase());
    const allPaid = po.every(x => x.paid);
    po.forEach(x => x.paid = !allPaid);
    await saveToStorage();
    render();
  }

  function setFilter(f, el) {
    filter = f;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    render();
  }

  // ── Render ──
  function render() {
    const people = [...new Set(orders.map(x => x.name.toLowerCase()))];
    const totalAmt = orders.reduce((s,x) => s+(x.price||0), 0);
    document.getElementById('totalPeople').textContent = people.length;
    document.getElementById('totalItems').textContent = orders.length;
    document.getElementById('totalPaid').textContent = orders.filter(x=>x.paid).length;
    document.getElementById('totalAmount').textContent = totalAmt ? formatRupiahFull(totalAmt) : 'Rp0';

    const grouped = {};
    orders.forEach(o => {
      const k = o.name.toLowerCase();
      if (!grouped[k]) grouped[k] = { name: o.name, items: [] };
      grouped[k].items.push(o);
    });

    const filtered = Object.values(grouped).map(g => ({
      ...g,
      items: g.items.filter(o => filter==='paid'?o.paid:filter==='unpaid'?!o.paid:true)
    })).filter(g => g.items.length > 0);

    const container = document.getElementById('ordersList');
    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="emoji">🍽️</div><p>Belum ada pesanan${filter!=='all'?' di kategori ini':''}.<br>Yuk tambahin!</p></div>`;
      return;
    }

    container.innerHTML = filtered.map(g => {
      const allPaid = g.items.every(x=>x.paid);
      const subtotal = g.items.reduce((s,x)=>s+(x.price||0),0);
      const color = getColor(g.name);
      const isMe = g.name.toLowerCase() === myName.toLowerCase();
      return `
        <div class="person-group">
          <div class="person-header">
            <div class="person-name-row">
              <div class="avatar ${color}">${getInitial(g.name)}</div>
              <div>
                <div class="person-name">${g.name}${isMe?' <span style="font-size:10px;color:var(--accent);font-weight:400">(kamu)</span>':''}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              ${subtotal?`<span class="person-total">${formatRupiahFull(subtotal)}</span>`:''}
              <button class="pay-all-btn ${allPaid?'paid-state':''}" onclick="togglePayAll('${g.name}')">
                ${allPaid?'✓ Lunas':'Tandai Lunas'}
              </button>
            </div>
          </div>
          ${g.items.map(o=>`
            <div class="order-item ${o.paid?'paid-item':''}">
              <button class="check-btn ${o.paid?'checked':''}" onclick="togglePaid(${o.id})">${o.paid?'✓':''}</button>
              <div class="order-info">
                <div class="order-menu">${o.menu}</div>
                <div class="order-meta">
                  ${o.price?`<span class="order-price">${formatRupiahFull(o.price)}</span>`:''}
                  ${o.note?`<span class="order-note">${o.note}</span>`:''}
                  ${o.addedBy && o.addedBy.toLowerCase()!==o.name.toLowerCase()?`<span class="order-by">nitip ke ${o.addedBy}</span>`:''}
                </div>
              </div>
              <button class="del-btn" onclick="deleteOrder(${o.id})">✕</button>
            </div>
          `).join('')}
        </div>`;
    }).join('');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function copyToClipboard() {
    if (!orders.length) { showToast('⚠️ Belum ada pesanan'); return; }
    const grouped = {};
    orders.forEach(o => {
      const k = o.name.toLowerCase();
      if (!grouped[k]) grouped[k] = { name: o.name, items: [] };
      grouped[k].items.push(o);
    });
    let text = `🍽️ *Rekap Nitip Makan*\n`;
    const now = new Date();
    text += `📅 ${now.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}\n\n`;
    let i = 1;
    Object.values(grouped).forEach(g => {
      g.items.forEach(o => {
        text += `${i}. *${g.name}* — ${o.menu}`;
        if (o.price) text += ` (${formatRupiahFull(o.price)})`;
        if (o.note) text += ` [${o.note}]`;
        if (o.paid) text += ` ✅`;
        text += `\n`;
        i++;
      });
    });
    const total = orders.reduce((s,x)=>s+(x.price||0),0);
    if (total>0) text += `\n💰 *Total: ${formatRupiahFull(total)}*`;
    navigator.clipboard.writeText(text).then(()=>showToast('✓ Disalin ke clipboard!'));
  }

  function openModal() { document.getElementById('overlay').classList.add('show'); }
  function closeModal() { document.getElementById('overlay').classList.remove('show'); }
  async function confirmReset() {
    orders = []; colorMap = {}; colorIdx = 0;
    await saveToStorage();
    render(); closeModal();
    showToast('🗑 Semua pesanan dihapus');
  }

  document.addEventListener('keydown', e => {
    if (e.key==='Enter' && ['inputName','inputMenu','inputPrice','inputNote'].includes(document.activeElement.id)) addOrder();
  });
  document.getElementById('myNameInput').addEventListener('keydown', e => { if(e.key==='Enter') setMyName(); });

  const d = new Date();
  document.getElementById('sessionDate').textContent = d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});

  initNameModal();
</script>
</body>
</html>
